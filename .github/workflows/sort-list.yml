name: Sort Demonlist

on:
  push:
    branches:
      - main
    paths:
      - "data/_list.json"

permissions:
  contents: write

jobs:
  sort:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sort_list.py
        run: python sort_list.py --auto

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_list.json
          git diff --cached --quiet || (git commit -m "Auto-sort demonlist" && git push)
