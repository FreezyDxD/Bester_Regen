name: Update demonlist order

on:
  push:
    branches:
      - main
    paths:
      - "data/_list.json"
      - "data/*.json"

  schedule:
    - cron: "17 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-demonlist
  cancel-in-progress: false

jobs:
  sort:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sort levels using AREDL
        run: python sort_list.py --auto

      - name: Save updated order to GitHub
        run: |
          if git diff --quiet -- data/_list.json; then
            echo "No changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/_list.json
          git commit -m "Update demonlist order from AREDL"
          git push
